<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="Remote terminals stand open. For collaboration, contract, or casual comms — route through the channels below."><style>@font-face{font-family:'Rajdhani';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.r{font-family:'Rajdhani',sans-serif;font-weight:400}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(.02)}}
@keyframes fadeIn{from{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.gx{transform-box:fill-box;transform-origin:left;animation:growX .8s ease-out both}
.gy{transform-box:fill-box;transform-origin:bottom;animation:growY .6s ease-out both}
.fi{animation:fadeIn .5s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0B1E2E" stop-opacity=".92"/>
  <stop offset="1" stop-color="#132C3F" stop-opacity=".86"/>
</linearGradient></defs><text x="600" y="26" class="r" font-size="20" fill="#C0CAD3" text-anchor="middle">Remote terminals stand open. For collaboration, contract, or casual comms — route</text><text x="600" y="58" class="r" font-size="20" fill="#C0CAD3" text-anchor="middle">through the channels below.</text></svg>